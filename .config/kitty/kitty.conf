# kitty.conf generated by Confitty on 2026-06-24
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family GeistMono Nerd Font Mono
font_size 16

# --- Cursor ---
cursor_blink_interval 0.5

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
copy_on_select clipboard
focus_follows_mouse no

# --- Bell ---
enable_audio_bell yes

# --- Window Layout ---
window_border_width 1pt
window_padding_width 4
inactive_text_alpha 0.7
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_edge top
tab_powerline_style slanted
hide_window_decorations yes

# --- Transparency ---
background_opacity 0.9
dynamic_background_opacity yes
background_blur 32
#background_tint 0.5

# --- Window lifecycle ---
close_on_child_death no
shell zsh -lic 'while true; do exec zsh -li; done'

# Option+Enter stays a modifier chord. macOS Option is not Alt unless
# macos_option_as_alt is set, so map this key on its own. CSI 13;3 u is
# <M-CR>. tmux 3.6 forwards that sequence and drops CSI 57414;3 u.
map opt+enter send_text all \e[13;3u
