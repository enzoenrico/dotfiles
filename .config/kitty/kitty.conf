# kitty.conf generated by Confitty on 2026-06-24
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family GeistMono Nerd Font Mono
font_size 16

# --- Cursor ---
cursor_blink_interval 0.5

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
copy_on_select clipboard
focus_follows_mouse yes

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
window_padding_width 4
active_border_color #ea76cb
inactive_text_alpha 0.7
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_edge top
tab_powerline_style slanted
active_tab_foreground #cdd6f4
active_tab_background #f5c2e7
inactive_tab_foreground #cdd6f4
inactive_tab_background #383848

# --- Transparency ---
#background_opacity 0.9
dynamic_background_opacity yes
background_blur 1
#background_tint 0.5

# --- Window lifecycle ---
close_on_child_death no
shell zsh -li
