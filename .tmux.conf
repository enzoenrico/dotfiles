# =============================================================================
# Tmux Configuration — default Ctrl+b prefix, vim-style pane navigation
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Prefix and Basic Setup
# -----------------------------------------------------------------------------
set -g prefix C-b
bind-key C-b send-prefix

# -----------------------------------------------------------------------------
# 2. Pane Navigation (vim-style)
# -----------------------------------------------------------------------------
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# -----------------------------------------------------------------------------
# 3. Close Panes / Agent session cleanup
# -----------------------------------------------------------------------------
bind x kill-pane
bind X kill-window
# Prefix+Q — kill entire cursor-agents session (all agent windows at once)
bind Q if-shell 'tmux has-session -t cursor-agents 2>/dev/null' \
  'confirm-before -p "kill ALL cursor agent windows?" "kill-session -t cursor-agents"' \
  'display-message "No cursor-agents session"'

# -----------------------------------------------------------------------------
# 4. Copy Mode / Scrollback
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind -r [ copy-mode

# -----------------------------------------------------------------------------
# 5. Common Actions
# -----------------------------------------------------------------------------
# Prefix p/n — prev/next window; Prefix : — command; Prefix d — detach.
# Prefix c / s / v — set after TPM (cwd-preserving).

# -----------------------------------------------------------------------------
# 6. Additional Settings
# -----------------------------------------------------------------------------
set -g mouse on

# OSC 8 hyperlinks (Neovim, etc.) pass through to WezTerm for Cmd+click.
# WezTerm: bypass_mouse_reporting_modifiers = "SUPER|SHIFT" in wezterm.lua.
set -g allow-passthrough on
set -as terminal-features ',*:extkeys'
set -as terminal-features ',wezterm*:RGB'
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1

set -g status-style "#{?client_prefix,bg=blue#,fg=white,bg=default#,fg=default}"
set -g status-left ' [#S]#{?#{==:#S,cursor-agents}, #[fg=red]AGENTS#[default],}'
set -g status-right '#{?client_prefix,#[bold] PREFIX #[default] ,}%H:%M %d-%b-%y'

# -----------------------------------------------------------------------------
# 7. TPM
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# -----------------------------------------------------------------------------
# 8. After TPM: cwd-preserving window/splits
# -----------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind s split-pane -v -c "#{pane_current_path}"
bind v split-pane -h -c "#{pane_current_path}"
