# =============================================================================
# Tmux Configuration - Escape prefix, vim-style navigation (matches Cursor editor)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Prefix and Basic Setup
# -----------------------------------------------------------------------------
set -g prefix Escape
unbind-key C-b
bind-key Escape send-prefix

# -----------------------------------------------------------------------------
# 2. Pane Navigation (vim-style, matches cmd+h/j/k/l in Cursor)
# -----------------------------------------------------------------------------
bind -r h select-pane -L    # left
bind -r j select-pane -D    # down
bind -r k select-pane -U    # up
bind -r l select-pane -R    # right

# -----------------------------------------------------------------------------
# 3. Close Panes
# -----------------------------------------------------------------------------
bind x kill-pane             # Esc, x - close current pane (with confirm)
bind X kill-window           # Esc, X - close current window

# -----------------------------------------------------------------------------
# 4. Terminal Output Navigation (Copy Mode / Scrollback)
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind -r [ copy-mode          # Esc, [ - enter scrollback (j/k scroll, q to exit)

# -----------------------------------------------------------------------------
# 5. Common Actions
# -----------------------------------------------------------------------------
# Esc, p - previous window
# Esc, n - next window
# Esc, : - command prompt
# Esc, c - new window
# Esc, s - split pane horizontally (stacked)
# Esc, v - split pane vertically (side by side)
# Esc, d - detach session
bind s split-pane -v
bind v split-pane -h

# -----------------------------------------------------------------------------
# 6. Additional Settings
# -----------------------------------------------------------------------------
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1

# ESC mode: entire status bar turns blue when prefix active
set -g status-style "#{?client_prefix,bg=blue#,fg=white,bg=default#,fg=default}"
set -g status-left ' [#S] '
set -g status-right '#{?client_prefix,#[bold] ESC #[default] ,}#22T %H:%M %d-%b-%y'

# -----------------------------------------------------------------------------
# 7. TPM (Tmux Plugin Manager)
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then start tmux and press Esc, I (capital I) to install plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
