# =============================================================================
# Tmux Configuration — default Ctrl+b prefix, vim-style pane navigation
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Prefix and Basic Setup
# -----------------------------------------------------------------------------
set -g prefix C-b
bind-key C-b send-prefix

# -----------------------------------------------------------------------------
# 2. Pane Navigation (vim-style)
# -----------------------------------------------------------------------------
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Prefix + H/J/K/L — swap with neighbor, or break pane to that edge if none
# (e.g. no pane above + K → current becomes full-width top, rest go below)
# Also bind S-h etc: kitty/extkeys may send Shift+h as S-h, not H.
bind -r H if -F '#{pane_at_left}' {
  split-window -fhb
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{left-of}'
}
bind -r J if -F '#{pane_at_bottom}' {
  split-window -fv
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{down-of}'
}
bind -r K if -F '#{pane_at_top}' {
  split-window -fvb
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{up-of}'
}
bind -r L if -F '#{pane_at_right}' {
  split-window -fh
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{right-of}'
}
bind -r S-h if -F '#{pane_at_left}' {
  split-window -fhb
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{left-of}'
}
bind -r S-j if -F '#{pane_at_bottom}' {
  split-window -fv
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{down-of}'
}
bind -r S-k if -F '#{pane_at_top}' {
  split-window -fvb
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{up-of}'
}
bind -r S-l if -F '#{pane_at_right}' {
  split-window -fh
  swap-pane -t '{last}'
  kill-pane -t '{last}'
} {
  swap-pane -d -t '{right-of}'
}

# -----------------------------------------------------------------------------
# 3. Agent session cleanup (manual only — agent panes stay open after tasks exit)
# -----------------------------------------------------------------------------
bind x kill-pane
bind X kill-window
# Prefix+Q — kill entire cursor-agents session (all agent windows at once)
bind Q if-shell 'tmux has-session -t cursor-agents 2>/dev/null' \
  'confirm-before -p "kill ALL cursor agent windows?" "kill-session -t cursor-agents"' \
  'display-message "No cursor-agents session"'
# Prefix+o — kill legacy term-* orphan sessions
bind o confirm-before -p "kill ALL term-* orphan sessions?" \
  'run-shell "tmux list-sessions -F '\''#{session_name}'\'' 2>/dev/null | grep -E '\''^term-'\'' | while read -r s; do tmux kill-session -t \"\$s\"; done"'
# Prefix+M — switch to user main session
bind M if-shell 'tmux has-session -t main 2>/dev/null' \
  'switch-client -t main' \
  'display-message "No main session"'

# -----------------------------------------------------------------------------
# 4. Copy Mode / Scrollback
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind -r [ copy-mode

# -----------------------------------------------------------------------------
# 5. Common Actions
# -----------------------------------------------------------------------------
# Prefix p/n — prev/next window; Prefix : — command; Prefix d — detach.
# Prefix c / s / v — set after TPM (cwd-preserving).

# -----------------------------------------------------------------------------
# 6. Additional Settings
# -----------------------------------------------------------------------------
set -g mouse on

# OSC 8 hyperlinks (Neovim, etc.) pass through to WezTerm for Cmd+click.
# WezTerm: bypass_mouse_reporting_modifiers = "SUPER|SHIFT" in wezterm.lua.
set -g allow-passthrough on
set -as terminal-features ',*:extkeys'
set -as terminal-features ',wezterm*:RGB'
# WezTerm kitty keyboard: Shift+h arrives as S-h (not ASCII H) once requested.
set -s extended-keys on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1

# -----------------------------------------------------------------------------
# Style — minimal Nord, transparent bar on top
# -----------------------------------------------------------------------------
gray_light="#E7E7E7"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
yellow_soft="#EBCB8B"
red_soft="#BF616A"

set -g status-position top
set -g status-interval 3
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S#{?#{==:#S,cursor-agents}, #[fg=${red_soft}]TOOLS,#{?#{m:term*,#S}, #[fg=${yellow_soft}]ORPHAN,}} #[fg=${gray_light},nobold]| "
set -g status-right "#{?client_prefix,#[fg=${blue_muted}#,bold]PREFIX#[fg=${gray_light}#,nobold]  ,} #{cpu}   #{mem} "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"

set -g pane-border-lines heavy
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"
set -ug window-style
set -ug window-active-style

# -----------------------------------------------------------------------------
# 7. TPM
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # #{cpu} / #{mem} in status-right

run '~/.tmux/plugins/tpm/tpm'

# -----------------------------------------------------------------------------
# 8. After TPM: cwd-preserving window/splits
# -----------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind s split-pane -v -c "#{pane_current_path}"
bind v split-pane -h -c "#{pane_current_path}"
